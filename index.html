<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaurya Fan Club</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#111827,#1f2937,#111827);
    color:white;
    overflow-x:hidden;
}

/* HERO */
.hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:4rem;
    margin-bottom:15px;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px #00e5ff;
    }
    to{
        text-shadow:0 0 25px #ff00ff;
    }
}

.hero p{
    font-size:1.2rem;
    max-width:700px;
    line-height:1.8;
    opacity:0.9;
}

.btn{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:#00e5ff;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    font-size:1rem;
}

.btn:hover{
    transform:scale(1.1);
}

/* CARDS */
.section{
    padding:60px 20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    max-width:1200px;
    margin:auto;
}

.card{
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    padding:25px;
    text-align:center;
    backdrop-filter:blur(10px);
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.1);
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
}

.card h2{
    margin-bottom:15px;
    color:#00e5ff;
}

/* FLOATING EMOJIS */
.emoji{
    position:fixed;
    font-size:25px;
    animation:float 6s linear infinite;
    opacity:0.8;
}

@keyframes float{
    0%{
        transform:translateY(100vh) rotate(0deg);
    }
    100%{
        transform:translateY(-20vh) rotate(360deg);
    }
}

/* CONFETTI */
.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-10px;
    z-index:999;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

/* FOOTER */
footer{
    text-align:center;
    padding:30px;
    opacity:0.8;
}

/* MOBILE */
@media(max-width:768px){

.hero h1{
    font-size:2.5rem;
}

.hero p{
    font-size:1rem;
}

}
</style>
</head>
<body>

<section class="hero">

    <h1>🔥 Shaurya Fan Club 🔥</h1>

    <p>
        Welcome to the most legendary fan page 😎  
        Style, aura, memes, and full entertainment mode activated.
    </p>

    <button class="btn" onclick="startConfetti()">
        Launch Celebration 🎉
    </button>

</section>

<section class="section">

    <div class="cards">

        <div class="card">
            <h2>😎 Aura</h2>
            <p>Maximum level personality detected.</p>
        </div>

        <div class="card">
            <h2>🔥 Energy</h2>
            <p>Always in main character mode.</p>
        </div>

        <div class="card">
            <h2>😂 Meme King</h2>
            <p>Unlimited meme content generator.</p>
        </div>

    </div>

</section>

<footer>
    Made for fun 🎉
</footer>

<script>

/* FLOATING EMOJIS */
function createEmoji(){

    const emoji = document.createElement("div");
    emoji.classList.add("emoji");

    const emojis = ["🔥","😎","😂","✨","🎉"];

    emoji.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];

    emoji.style.left = Math.random()*window.innerWidth + "px";

    emoji.style.animationDuration = (Math.random()*3+3)+"s";

    document.body.appendChild(emoji);

    setTimeout(()=>{
        emoji.remove();
    },6000);
}

setInterval(createEmoji,500);

/* CONFETTI */
function startConfetti(){

    const colors = [
        "#00e5ff",
        "#ff00ff",
        "#ffffff",
        "#ffcc00",
        "#ff5733"
    ];

    for(let i=0;i<250;i++){

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left = Math.random()*window.innerWidth + "px";

        confetti.style.background =
        colors[Math.floor(Math.random()*colors.length)];

        const size = Math.random()*8+5;

        confetti.style.width = size+"px";
        confetti.style.height = size+"px";

        confetti.style.animationDuration =
        (Math.random()*3+2)+"s";

        document.body.appendChild(confetti);

        setTimeout(()=>{
            confetti.remove();
        },5000);
    }
}

</script>

</body>
</html>
